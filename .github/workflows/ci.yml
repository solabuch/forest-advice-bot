name: CI

on:
  pull_request:
  push:
    branches: [main]

# Новий пуш у PR скасовує попередній прогін; на main — ні
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.13.1"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: forest
          POSTGRES_PASSWORD: forest
          POSTGRES_DB: forest_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forest -d forest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://forest:forest@localhost:5432/forest_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      # Модель embeddings (~135 МБ) — з кешу; ключ — скрипт із ревізією й sha256
      - uses: actions/cache@v6
        with:
          path: .data/models
          key: model-${{ hashFiles('scripts/fetch_model.py') }}
      - run: uv run poe model
      # Ті самі програми, що в образі: OCR сканів і старі .doc
      - name: OCR and .doc tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            tesseract-ocr tesseract-ocr-ukr tesseract-ocr-eng antiword
      - run: uv run pytest --junitxml=junit.xml --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # уся історія: секрет у старому коміті теж знайдеться
      # CLI, а не gitleaks-action: тому для організацій потрібна ліцензія
      - name: gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      # Власний пакет не на PyPI — пропускаємо, решту перевіряємо на відомі CVE
      - run: uv run pip-audit --skip-editable

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          # Той самий тег, що в compose.yaml: compose візьме цей образ, а не збиратиме вдруге
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Повний шлях compose: db → migrate (без токенів) → самоперевірка в контейнері
      - name: Self-check inside the container
        env:
          FAKE_TOKEN: "123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          FAKE_KEY: "gsk_xxxxxxxxxxxxxxxxxxxxxxxx"
        run: |
          docker compose run --rm \
            -e TELEGRAM_BOT_TOKEN="$FAKE_TOKEN" -e GROQ_API_KEY="$FAKE_KEY" \
            app check --offline --strict
      - name: Config errors are explained, not crashed
        run: |
          set +e
          out=$(docker compose run --rm app check 2>&1); code=$?
          echo "$out"
          test "$code" -eq 2 && echo "$out" | grep -q "Не задано TELEGRAM_BOT_TOKEN" && ! echo "$out" | grep -q Traceback
      - name: Image size
        run: |
          size=$(docker image inspect ghcr.io/${{ github.repository }}:latest --format '{{.Size}}')
          echo "Образ: $((size / 1024 / 1024)) МБ (без стиснення)" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: docker compose down -v
