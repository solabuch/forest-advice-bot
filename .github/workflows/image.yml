name: Image

# Готовий multi-arch образ у GHCR (ADR-11): compose спершу тягне його, а не збирає
# хвилинами з моделлю й Tesseract. Після merge у main — :latest; з релізу — ще й :X.Y.Z.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Версія релізу без «v», напр. 1.0.0
        type: string
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # arm64 — для рев'юерів на Mac з M-процесорами; збирається в емуляції
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
