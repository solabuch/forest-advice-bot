# Питання → відповідь (S-08): еталон, пастки архіву, місця, «не знайшов», нові документи.
#
#   question  — як пише звір
#   places    — які місця бот має зрозуміти з питання; [] — питає кнопками (D-06)
#   sources   — файли, які мають бути серед джерел відповіді
#   first     — джерело, що має йти першим (конкретне перед загальним, R-24)
#   facts     — що має бути у відповіді; «а | б» — будь-що з варіантів; порівняння без регістру
#   absent    — чого у відповіді бути не повинно (про що не питали, старий варіант)
#   found     — false: доречної поради немає, бот чесно каже «не знайшов» (D-08)
#   today     — дата для питань «сьогодні» (D-45); інакше — дата прогону з eval
#   req       — вимоги, які перевіряє кейс
#
# Для кожної відповіді ще перевіряється автоматично: усі джерела — з доречних місць
# (R-10, R-17, R-27) і чинних версій (R-15).

