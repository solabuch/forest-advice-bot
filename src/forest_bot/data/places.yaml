# Місця лісу (D-21): ліс → частини → рукавички. Не дерево, а DAG:
# «Під вербою» — у двох частинах, «На узліссі» — у жодній.
#
# id — сталі: документи в БД посилаються на них. Назви, синоніми й підписи міняти можна;
# зміна набуде чинності після перезапуску бота.
#   name     — як місце називається у відповіді
#   citation — як воно звучить у підписі: «— з документа «…» <citation>»
#   aliases  — інші назви, якими звірі кличуть місце (D-55); відмінки й «у/в» бот додає сам

forest:
  id: forest
  name: Ліс
  citation: всього лісу
  aliases: [весь ліс, увесь ліс, цілий ліс, для всіх]

parts:
  - id: coniferous
    name: Хвойний ліс
    citation: хвойного лісу
    aliases: [хвойна частина, хвойна частина лісу, хвойний, хвоя]
  - id: deciduous
    name: Листяний ліс
    citation: листяного лісу
    aliases: [листяна частина, листяна частина лісу, листяний]
  - id: river
    name: Біля річки
    citation: частини лісу біля річки
    aliases: [річкова частина, річкова, прибережна, прибережна частина, над річкою, коло річки]

mittens:
  - id: pid-yalynoiu
    name: Під ялиною
    citation: рукавички «Під ялиною»
    parts: [coniferous]
    aliases: [ялинова, ялинова рукавичка]
  - id: u-sosnakh
    name: У соснах
    citation: рукавички «У соснах»
    parts: [coniferous]
    aliases: [соснова, соснова рукавичка]
  - id: bilia-murashnyka
    name: Біля мурашника
    citation: рукавички «Біля мурашника»
    parts: [coniferous]
    aliases: [мурашникова, мурашникова рукавичка]
  - id: pid-dubom
    name: Під дубом
    citation: рукавички «Під дубом»
    parts: [deciduous]
    aliases: [дубова, дубова рукавичка]
  - id: u-lishchyni
    name: У ліщині
    citation: рукавички «У ліщині»
    parts: [deciduous]
    aliases: [ліщинова, ліщинова рукавичка, горіхова]
  - id: pid-verboiu
    name: Під вербою
    citation: рукавички «Під вербою»
    parts: [deciduous, river]
    aliases: [вербова, вербова рукавичка]
  - id: bilia-bobrovoi-hrebli
    name: Біля бобрової греблі
    citation: рукавички «Біля бобрової греблі»
    parts: [river]
    aliases: [боброва, боброва рукавичка, біля греблі]
  - id: na-uzlissi
    name: На узліссі
    citation: рукавички «На узліссі»
    parts: []
    aliases: [узлісся, узлісна, узлісна рукавичка]
