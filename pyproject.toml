[project]
name = "forest-bot"
# Версію веде release-please в src/forest_bot/__init__.py; динамічна версія не потрапляє в uv.lock
dynamic = ["version"]
description = "Telegram-бот порад для звірів лісу: документи → питання → відповідь із джерелом"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiogram>=3.20",
    "alembic>=1.15",
    "asyncpg>=0.32.0",
    "httpx>=0.28",
    "pydantic-settings>=2.9",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "tzdata>=2026.5",
]

[project.scripts]
forest-bot = "forest_bot.__main__:main"

[dependency-groups]
dev = [
  "asyncpg-stubs>=0.32.0",
  "mypy>=1.15",
  "pip-audit>=2.9",
  "poethepoet>=0.34",
  "pre-commit>=4.2",
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "pytest-cov>=6.1",
  "ruff>=0.11",
  "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/forest_bot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/forest_bot"]

# --- Задачі: uv run poe <задача>; check = те саме, що CI ---
[tool.poe.tasks]
lint = [{ cmd = "ruff check ." }, { cmd = "ruff format --check ." }]
fmt = [{ cmd = "ruff format ." }, { cmd = "ruff check --fix ." }]
types = "mypy"
test-unit = "pytest -m \"not integration and not e2e\""
test = "pytest"
check = ["lint", "types", "test"]
up = "docker compose up --build"
db = "docker compose -f compose.yaml -f compose.dev.yaml up -d --wait db"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["data/archive", "examples"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S", "PTH",
  "RUF", "N", "C4", "DTZ", "T20", "LOG", "G",
]
# Українські рядки й коментарі — не помилка
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # фейкові токени в тестах

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=forest_bot --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: потрібна БД (Postgres + pgvector)",
  "e2e: сценарій через Dispatcher із mock-сесією Bot API",
]

[tool.coverage.run]
branch = true
source = ["forest_bot"]

[tool.uv]
# та сама версія, що в CI й pre-commit: формат uv.lock не «гуляє»
required-version = ">=0.13.1"
