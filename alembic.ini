# Для розробки: uv run alembic revision -m "..." / upgrade head.
# У контейнері міграції запускає `python -m forest_bot migrate` без цього файлу.
[alembic]
script_location = %(here)s/src/forest_bot/migrations
file_template = rev_%%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
